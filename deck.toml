[package]
name = "jvc"
version = "0.1.0"
description = "the Jennifer deck manager: dependency resolution, vendoring, and publishing"
license = "LGPL-3.0-only"
authors = ["mplx <jennifer@mplx.dev>"]
keywords = ["package-manager", "decks", "jvc", "version-control", "jennifer"]

# Host capabilities this deck's code needs. Declared even though no file in
# src/ carries a `# pragma-jennifer-capability` of its own: jvc reaches the
# network through the bundled http.j, which declares `net` itself, so the
# interpreter already refuses jvc on a build without it. Saying so here makes
# the requirement visible before anything is run, and the publish gate accepts
# a manifest that declares more than its sources do (it only refuses one that
# declares less).
capabilities = ["net"]

# jvc is an *app*, not a deck: an unscoped name and a runnable entry script, so
# it is installed onto PATH rather than vendored, and `jvc publish` refuses it
# (a published deck must be scoped). Its releases are built by
# scripts/build-tarball.sh and scripts/build-deb.sh, not by `jvc pack`.
#
# jvc ships as its own OS package and is not bundled with the interpreter.
# `jvc app install <jvc-url>` still works and installs a second copy, which
# shadows a packaged one by PATH order rather than replacing it; jvc says so
# when that happens. See docs/cli.md.
bin = "bin/jvc"

# Project URLs by role. `deck` (the deck's own manifest / registry
# location) is mandatory; `homepage` and `manual` are optional.
[package.urls]
deck = "https://raw.githubusercontent.com/jennifer-language/jvc/main/deck.toml"
homepage = "https://jennifer-lang.dev"
manual = "https://jennifer-lang.dev"

# Jennifer engines that can run this deck: engine = version range. jvc uses only
# bundled stdlib modules (toml, yaml, json, flatdb, http, semver, web, ...), so
# its runtime dependency is the engine itself - hence [engines], not [decks].
#
# A floor, not a caret: jvc needs the @vendor/deck resolver, the http bytes body,
# and brace-escaped string literals, and the language is pre-1.0, so pinning one
# minor would need a jvc release per interpreter minor.
# jennifer-tiny is absent by design - jvc needs net.
[engines]
jennifer = ">=0.25.0"

# Runtime requirements: deck = version constraint. Registry decks only, and they
# MUST be scoped (@scope/deck); bundled modules go in [engines] above and local
# modules need no entry. jvc has no scoped-deck dependencies.
[decks]

# What this deck provides: capability = concrete version.
[provides]
deckmanager = "0.1.0"
