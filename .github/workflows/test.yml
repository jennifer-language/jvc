#
# PR gate: run every module's test overlay and the linter against two
# interpreters.
#
# - `release`: the 0.25.0 release tarball, the floor `[engines]` and every
#   pragma declare. A release build enforces those floors, so this job is the
#   one that proves jvc loads on the oldest interpreter it claims to support.
# - `tip`: built from the tip of the jennifer repository. A `-dev` build skips
#   every version floor, but it shows a language change breaking jvc here
#   rather than in somebody's install. It mirrors the M26.3 release gate,
#   where jennifer's own CI runs this suite against a release candidate.

name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml runs this as its gate, so a red suite blocks a tag from
  # being published rather than being noticed afterwards.
  workflow_call:

# A second push supersedes the first: the tip job builds an interpreter from
# source, so a superseded run is a minute of runner time for an answer nobody
# will read. Not applied to `release.yml`, where a superseded tag build would
# leave a release half-published.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: jennifer test + lint (${{ matrix.interpreter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        interpreter: [release, tip]
    env:
      # Bump together with `[engines]` and the pragmas.
      JENNIFER_RELEASE: 0.25.0
      # `verify.j` shells out to an interpreter to lint and test the deck it is
      # checking, and takes `jennifer` from PATH unless told otherwise. Neither
      # job puts its interpreter on PATH, so without this the verify overlays
      # fail with "executable file not found".
      JVC_JENNIFER: ${{ runner.temp }}/jennifer
    steps:
      - name: Checkout jvc
        uses: actions/checkout@v7

      - name: Install the release interpreter
        if: matrix.interpreter == 'release'
        run: |
          set -eu
          stage="jennifer-${JENNIFER_RELEASE}-linux-amd64"
          base="https://github.com/jennifer-language/jennifer/releases/download/${JENNIFER_RELEASE}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$stage.tar.gz"
          curl -fsSLO "$base/$stage.tar.gz.sha256"
          sha256sum -c "$stage.tar.gz.sha256"
          tar xzf "$stage.tar.gz"
          install -m755 "$stage/jennifer" "$RUNNER_TEMP/jennifer"
          # The bundled modules jvc imports by bare name (http.j, semver.j, ...)
          # sit in the tarball, not at the FHS location a package installs to.
          echo "JENNIFER_SYSMODDIR=$RUNNER_TEMP/$stage/share/jennifer/modules" >> "$GITHUB_ENV"

      - name: Checkout the interpreter
        if: matrix.interpreter == 'tip'
        uses: actions/checkout@v7
        with:
          repository: jennifer-language/jennifer
          path: .interpreter
          # The interpreter stamps its version from `git describe`, and a
          # shallow checkout would leave it without tags to describe from.
          fetch-depth: 0

      - name: Set up Go
        if: matrix.interpreter == 'tip'
        uses: actions/setup-go@v6
        with:
          go-version-file: .interpreter/go.mod
          cache-dependency-path: .interpreter/go.sum

      - name: Build the interpreter
        if: matrix.interpreter == 'tip'
        working-directory: .interpreter
        run: |
          go build -o "$RUNNER_TEMP/jennifer" ./cmd/jennifer
          echo "JENNIFER_SYSMODDIR=$GITHUB_WORKSPACE/.interpreter/modules" >> "$GITHUB_ENV"

      - name: Report what we are testing against
        run: '"$RUNNER_TEMP/jennifer" --version'

      - name: Run every module's overlay
        run: |
          set -eu
          # Globbed rather than listed, so a new module cannot be added
          # without its overlay running here.
          for overlay in src/*_test.j; do
              echo "== $overlay"
              "$RUNNER_TEMP/jennifer" test "$overlay"
          done

      - name: Lint
        run: '"$RUNNER_TEMP/jennifer" lint src/*.j bin/jvc'

      - name: Smoke-test the launcher
        # Every test exercises a module directly; nothing else here runs the
        # command a user runs. This is what catches the launcher's relative
        # `import "../src/cli.j"` breaking, which is a cross-repo contract (the
        # OCI image and both OS packages stage `bin/` and `src/` as siblings)
        # and is invisible to the suite.
        run: |
          set -eu
          "$RUNNER_TEMP/jennifer" run bin/jvc version
          "$RUNNER_TEMP/jennifer" run bin/jvc list
          "$RUNNER_TEMP/jennifer" run bin/jvc help > /dev/null

      - name: jvc passes its own quality gate
        # `jvc publish` refuses any deck whose lint, overlays or docblocks have
        # drifted. jvc has to clear the bar it holds everyone else to, and the
        # docblock leg is the one the steps above do not cover: it had drifted
        # 25 ways before this check existed.
        run: |
          cat > "$RUNNER_TEMP/selfgate.j" <<'EOF'
          use io;
          use os;
          import "./src/verify.j" as verify;
          def r as verify.Report init verify.verify(".");
          io.printf("%s\n", verify.reportText($r));
          if (not $r.ok) { exit 1; }
          EOF
          cp "$RUNNER_TEMP/selfgate.j" selfgate.j
          "$RUNNER_TEMP/jennifer" run selfgate.j
          rm -f selfgate.j

      - name: Check for em-dashes and en-dashes
        # A repo convention, and the kind of thing that is invisible in
        # review and trivial for a machine.
        run: |
          # The whole tree, not a list of extensions. JENNIFER.md is the
          # interpreter's reference, copied in, and not ours to restyle.
          if grep -rInP '\xe2\x80\x93|\xe2\x80\x94' \
                  --exclude-dir=.git --exclude-dir=.interpreter \
                  --exclude=JENNIFER.md . ; then
              echo "::error::em-dash or en-dash found (repo convention forbids both)"
              exit 1
          fi
