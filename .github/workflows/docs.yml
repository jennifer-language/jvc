#
# Build the Grimoire book in docs/ and publish it to GitHub Pages, through
# Grimoire's shared workflow:
# https://grimoire.jennifer-lang.dev/github-pages.html
#
# The site root is the book as it stood at the highest release tag (plain
# MAJOR.MINOR.PATCH, the same tags release.yml builds), so a reader of the
# latest release reads that release's documentation. Until the first release,
# main is published at the root. Unreleased documentation is not published
# (`dev: false`), so there is no /dev/.
#
# `uses` and `image` are pinned to the same Grimoire release; move both
# together.

name: docs

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
    # Until the first release, every merge refreshes the root. Afterwards a
    # push to main only republishes the same release, so this can go then.
    branches: [main]
  # A pull request builds and checks the book but never publishes.
  pull_request:
  # Publishing by hand is useful when only the theme or the config moved.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    # A called workflow can narrow what it is given but never widen it, so the
    # Pages deployment permissions are granted here.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: jennifer-language/grimoire/.github/workflows/docs-pages.yml@0.4.0
    with:
      image: ghcr.io/jennifer-language/grimoire:0.4.0
      dev: false
      # A Pages deployment publishes exactly what the artifact holds, so a
      # build that dropped docs/CNAME would quietly unbind jvc.jennifer-lang.dev
      # and leave the site on github.io with no error anywhere.
      check: |
        grep -qx 'jvc.jennifer-lang.dev' "$SITE/CNAME"
